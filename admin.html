<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17483f" />
  <title>PRH | Admin</title>
  <link rel="stylesheet" href="wallet.css" />
</head>
<body class="supabase-wallet">
  <header class="wallet-topbar">
    <a class="wallet-brand" href="index.html" aria-label="PRH account">
      <span class="wallet-brand-mark">PRH</span>
      <span>Account administration</span>
    </a>
    <nav class="wallet-user-nav" aria-label="Admin navigation">
      <span id="adminEmail"></span>
      <a class="wallet-admin-link" href="index.html">User account</a>
      <button class="wallet-button wallet-button-quiet" id="adminSignOut" type="button" hidden>Sign out</button>
    </nav>
  </header>

  <main class="wallet-admin-main">
    <div class="wallet-notice" id="adminSetupMessage" role="alert" hidden></div>
    <section class="wallet-admin-login" id="adminLoginPanel" aria-labelledby="adminLoginHeading">
      <p class="wallet-eyebrow">ADMIN ACCESS</p>
      <h1 id="adminLoginHeading">Administrator sign in</h1>
      <p>Sign in with an allowlisted administrator account to review requests.</p>
      <form class="wallet-form" id="adminLoginForm">
        <label for="adminLoginEmail">Email</label>
        <input id="adminLoginEmail" type="email" autocomplete="username" required />
        <label for="adminLoginPassword">Password</label>
        <input id="adminLoginPassword" type="password" autocomplete="current-password" required />
        <button class="wallet-button wallet-button-primary" type="submit">Sign in</button>
      </form>
      <p class="wallet-status" id="adminStatus" role="status" aria-live="polite"></p>
    </section>

    <section class="wallet-admin-dashboard" id="adminDashboard" aria-labelledby="adminHeading" hidden>
      <div class="wallet-admin-toolbar">
        <div>
          <p class="wallet-eyebrow">REQUEST REVIEW</p>
          <h1 id="adminHeading">Deposit and withdrawal requests</h1>
          <p class="wallet-admin-count" id="adminRequestCount"></p>
        </div>
        <button class="wallet-button wallet-button-quiet" id="adminRefresh" type="button">Refresh</button>
      </div>
      <p class="wallet-status" id="adminDashboardStatus" role="status" aria-live="polite"></p>
      <div class="wallet-admin-filters" role="group" aria-label="Filter requests">
        <button class="wallet-admin-filter is-active" data-admin-filter="pending" type="button" aria-pressed="true">Pending</button>
        <button class="wallet-admin-filter" data-admin-filter="reviewed" type="button" aria-pressed="false">Reviewed</button>
        <button class="wallet-admin-filter" data-admin-filter="all" type="button" aria-pressed="false">All</button>
      </div>
      <div class="wallet-admin-list" id="adminRequestList"></div>
    </section>
  </main>

  <footer class="wallet-footer">Only allowlisted administrators can review requests.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin-client.js"></script>
</body>
</html>
